name: Flutter CI

on:
  push:
    branches:
      - main
      - throttle_rohan
      - throttle_amit
      - throttle_abhay
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'  # adjust to your version
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Check Build (Debug APK)
        run: flutter build apk --debug
