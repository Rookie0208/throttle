<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Riders App - Auth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 400px;
      background: #020617;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .toggle {
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      color: #60a5fa;
      font-size: 14px;
    }

    .msg {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2 id="title">User Register</h2>

  <!-- USER REGISTER -->
  <div id="userRegister">
    <input id="firstName" placeholder="First Name">
    <input id="lastName" placeholder="Last Name">

    <select id="pronoun">
      <option value="">Select Pronoun</option>
      <option value="HE/HIM">He / Him</option>
      <option value="SHE/HER">She / Her</option>
      <option value="OTHER">Other</option>
    </select>

    <select id="role">
      <option value="">Select Role</option>
      <option value="CAPTAIN">Captain</option>
      <option value="RIDER">Rider</option>
    </select>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <input id="experienceYears" type="number" placeholder="Experience Years (optional)">
    <input id="emergencyContact" placeholder="Emergency Contact (optional)">

    <button onclick="registerUser()">Register</button>
  </div>

  <!-- ADMIN REGISTER -->
  <div id="adminRegister" style="display:none;">
    <input id="adminName" placeholder="Admin Name">
    <input id="adminEmail" placeholder="Admin Email">
    <input id="adminPassword" type="password" placeholder="Password">
    <button onclick="registerAdmin()">Register Admin</button>
  </div>

  <!-- LOGIN -->
  <div id="loginForm" style="display:none;">
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <div class="toggle" onclick="showUserRegister()">User Register</div>
  <div class="toggle" onclick="showAdminRegister()">Admin Register</div>
  <div class="toggle" onclick="showLogin()">Login</div>

  <div class="msg" id="msg"></div>

</div>

<script>
const BASE_URL = "http://localhost:8080/api/v1";

function hideAll() {
  userRegister.style.display = "none";
  adminRegister.style.display = "none";
  loginForm.style.display = "none";
}

function showUserRegister() {
  hideAll();
  userRegister.style.display = "block";
  title.innerText = "User Register";
}

function showAdminRegister() {
  hideAll();
  adminRegister.style.display = "block";
  title.innerText = "Admin Register";
}

function showLogin() {
  hideAll();
  loginForm.style.display = "block";
  title.innerText = "Login";
}

// USER REGISTER
async function registerUser() {
  const data = {
    firstName: firstName.value,
    lastName: lastName.value,
    pronoun: pronoun.value,      // backend maps pronoun → gender
    role: role.value,
    email: email.value,
    password: password.value,
    experienceYears: experienceYears.value || 0,
    emergencyContact: emergencyContact.value || null
  };

  const res = await fetch(`${BASE_URL}/auth/register`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const json = await res.json();
  msg.innerText = json.message || "User registered successfully";
}

// ADMIN REGISTER
async function registerAdmin() {
  const data = {
    name: adminName.value,
    email: adminEmail.value,
    password: adminPassword.value
  };

  const res = await fetch(`${BASE_URL}/auth/admin/register`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const json = await res.json();
  msg.innerText = json.message || "Admin registered successfully";
}

// LOGIN
async function login() {
  const data = {
    email: loginEmail.value,
    password: loginPassword.value
  };

  const res = await fetch(`${BASE_URL}/auth/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const json = await res.json();

  if (json.data?.token) {
    localStorage.setItem("token", json.data.token);
    msg.innerText = "Login successful. JWT saved.";
  } else {
    msg.innerText = "Login failed";
  }
}
</script>

</body>
</html>
