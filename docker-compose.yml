services:
  postgres:
    image: postgres:16
    container_name: throttle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: throttleDB
      POSTGRES_USER: throttle_user
      POSTGRES_PASSWORD: throttle1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - throttle-network

  redis:
    image: redis:latest
    container_name: throttle-redis
    restart: unless-stopped
    labels:
      logging: "promtail"
    ports:
      - "6379:6379"
    networks:
      - throttle-network

  neo4j:
    image: neo4j:latest
    container_name: throttle-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/throttle1234
    volumes:
      - neo4j_data:/data
    networks:
      - throttle-network

  kafka:
    image: apache/kafka:latest
    container_name: throttle-kafka
    restart: unless-stopped
    labels:
      logging: "promtail"
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - throttle-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: throttle-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - throttle-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: throttle-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - throttle-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: throttle-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - throttle-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.2
    container_name: throttle-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
      - kafka
    networks:
      - throttle-network

  prometheus:
    image: prom/prometheus:latest
    container_name: throttle-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - throttle-network

  grafana:
    image: grafana/grafana:latest
    container_name: throttle-grafana
    restart: unless-stopped
    labels:
      logging: "promtail"
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=lokiLive
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - throttle-network

  # ── Log Aggregation Pipeline ───────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: throttle-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - throttle-network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: throttle-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount local app logs so Promtail can ship them to Loki
      # when Spring Boot runs via mvnw (not in Docker)
      - ./throttle/logs:/app/logs:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - throttle-network

volumes:
  postgres_data:
  neo4j_data:
  kafka_data:
  loki_data:
  grafana_data:

networks:
  throttle-network:
    driver: bridge
