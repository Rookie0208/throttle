services:
  # ── Core Backend Service ──────────────────────────────────────────────────
  backend:
    build:
      context: ./throttle
      dockerfile: Dockerfile
    container_name: throttle-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/throttleDB
      - SPRING_DATASOURCE_USERNAME=throttle_user
      - SPRING_DATASOURCE_PASSWORD=throttle1234
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=throttle1234
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - throttle-network

  # ── Relational Database (PostgreSQL) ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: throttle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: throttleDB
      POSTGRES_USER: throttle_user
      POSTGRES_PASSWORD: throttle1234
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U throttle_user -d throttleDB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - throttle-network

  # ── Cache & Session Store (Redis) ────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: throttle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - throttle-network

  # ── Graph Database (Neo4j) ───────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: throttle-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/throttle1234
    volumes:
      - neo4j_data:/data
    networks:
      - throttle-network

  # ── Event Streaming (Kafka) ──────────────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: throttle-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - throttle-network

volumes:
  postgres_data:
  neo4j_data:
  kafka_data:

networks:
  throttle-network:
    driver: bridge
