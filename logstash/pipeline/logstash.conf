input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["admin-audit-logs"]
    codec => "json"
  }
}

filter {
  # Add any required parsing/filtering here
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "admin-audit-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
