server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── JOB 1: Docker container logs (used when app runs in Docker) ──────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - json:
          expressions:
            level: level
            traceId: traceId
            stream: stream
      - labels:
          level:
          stream:

  # ── JOB 2: Local app logs (used when app runs via mvnw spring-boot:run) ──
  # Tails the JSON files written to throttle/logs/ by the 'local' Spring profile.
  # The /app/logs path is mounted from the host via docker-compose volumes.
  - job_name: local-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: throttle-local
          container: throttle
          stream: app
          env: local
          __path__: /app/logs/throttle.json

  - job_name: local-access-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: throttle-local
          container: throttle
          stream: access
          env: local
          __path__: /app/logs/access.json

  - job_name: local-mobile-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: throttle-local
          container: throttle
          stream: mobile
          env: local
          __path__: /app/logs/mobile.json
